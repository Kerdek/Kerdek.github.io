function update_graph() {
graph.width = graph.clientWidth * window.devicePixelRatio
graph.height = graph.clientHeight * window.devicePixelRatio

gl.viewport(0, 0, graph.width, graph.height)

const fs = gl.createShader(gl.FRAGMENT_SHADER)
gl.shaderSource(fs, `#version 300 es
precision highp float;

float wavelength;

${model.getValue()}

uniform vec3 cmf[471];
uniform vec2 res;

out vec3 o;

vec3 srgb_gamma(
  vec3 v) {
return mix(
1.055 * pow(v, vec3(0.41666666)) - 0.055,
12.95 * v,
step(v, vec3(3.1308e-3))); }

void main(void)
{
vec2 XY = res;
vec2 xy = gl_FragCoord.xy;
vec2 uv = xy / XY;
if (int(xy.y) >= int(0.5 * XY.y)) {
  xy.y -= 0.5 * XY.y;
  XY.y *= 0.5;
  uv.y = 2.0 * uv.y - 1.0;
  float wl = mix(360.0, 830.0, uv.x);
  float wlp = mix(360.0, 830.0, uv.x + 1.0 / XY.x);
  vec3 base_color = cmf[int(wl - 360.0)];
  float spectral_power = (wavelength = wl, spectrum());
  float power = exp(10.0 * (0.5 - uv.y));
  o = power * (spectral_power * base_color);
  int a = int((wavelength = wl, spectrum()) * XY.y);
  int b = int((wavelength = wlp, spectrum()) * XY.y);
  if (b < a) {
    int t = b;
    b = a;
    a = t; }
  if (int(xy.y) >= a && int(xy.y) <= b) {
    o = 1.0 - o; } }
else {
  XY.y *= 0.5;
  uv.y = 2.0 * uv.y;
  float a = (int(xy.y) >= int(0.8 * XY.y) ? 1.0 : exp(10.0 * (uv.x - 0.5))) / 100.0;
  vec3 c = vec3(0.0);

  for (int i = 0; i < 471; i++) {
    c += cmf[i] * (wavelength = 360.0 + float(i), spectrum()); }

  o = a * c;
  if (int(xy.x) == int(0.5 * XY.x)) {
    o = 1.0 - o; } }

  o = srgb_gamma(o); }`)
gl.compileShader(fs)
const sp = gl.createProgram()
gl.attachShader(sp, vs)
gl.attachShader(sp, fs)
gl.linkProgram(sp)

if (!gl.getProgramParameter(sp, gl.LINK_STATUS)) {
  console.log(gl.getProgramInfoLog(sp))
  return }

gl.useProgram(sp)
gl.uniform3fv(gl.getUniformLocation(sp, 'cmf'), cmf)
gl.uniform2f(gl.getUniformLocation(sp, 'res'), graph.width, graph.height)
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
gl.finish() }

require.config({ paths: { vs: './monaco/vs' } })
await new Promise (cb => require(['vs/editor/editor.main'], cb))

monaco.editor.setTheme('hc-black')
