h1(`Lambda Calculus for Formal Verification`),

h2(`The Verification Gap`),

p(`When you created software, you discovered
a familiar tension. You wrote a function,
tested it on inputs, and checked the behavior.
Yet, some doubt remained. Is it always right?
For every possible input?`),

p(`You may claim “the result is never
negative”. Because the possible inputs are
infinite, that claim transcends the test
suite. It is not about a handful of test
cases. It’s about a universal property, but
the evidence from a test remains circumstantial.`),

p(`This gap, between testing and verification,
drives programmers to various resorts: increased

linting, defensive programming, and sophisticated
typing systems. These valuable practices
share a fundamental limitation. They don’t
establish universal properties. Those lived
in comments, documentation, and discussions,
which are not checked by the machine.`),

p(`A test can show the presence of bugs.
A proof can show their absence. Proof closes

is multiplied when I square it, so the result
is never negative.” This reasoning is sound,
but the machine does not check it.`),

p(`The machine can check the reasoning
when the claim is expressed as a proposition.
This is the promise of the Curry-Howard correspondence,
the connection between programs and proofs.`),

p(`Other approaches use types to constrain
the program. They automate proving some claims,
but only support certain programs, and reject
all the others. That is a kind of forfeiture.`),

p(`We will answer the foundational problem,
which is to verify a property of whatever
program. The program will appear in a proposition,
and the proposition will be the type of a
proof.`),

p(`The proposition does not constrain

is a proof. A valid proof shows the program

are typing derivations. A type checker is
a proof checker.`),
